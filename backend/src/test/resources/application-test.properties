# Profil "test" : base PostgreSQL dédiée aux tests (afob_test), distincte de la base de développement (afob).
# Flyway y applique les migrations et Hibernate y valide le schéma (voir application.properties).
#
# Aucun identifiant n'est écrit ici : ils viennent des variables POSTGRES_USER et POSTGRES_PASSWORD,
# les mêmes que dans .env et compose.yaml. Si elles ne sont pas déjà dans l'environnement,
# le fichier .env de la racine du projet est lu (chemin relatif au dossier backend/ où Maven lance les tests).
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5434/afob_test}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
