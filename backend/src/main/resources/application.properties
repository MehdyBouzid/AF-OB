spring.application.name=backend

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

server.port=${PORT:4000}

# CORS
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:4200}

# Erreurs
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.devtools.add-properties=false

# OpenAPI : n'ajoute pas automatiquement les reponses des @RestControllerAdvice
# a tous les endpoints (evite les 400/404 "parasites" sur des routes qui ne les renvoient jamais)
springdoc.override-with-generic-response=false